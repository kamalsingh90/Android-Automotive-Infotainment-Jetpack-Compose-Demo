image: eclipse-temurin:17-jdk-jammy

variables:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_SDK_TOOLS: "11076708"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

stages:
  - build
  - test
  - lint
  - ui-test
  - package

before_script:
  - export GRADLE_USER_HOME=$(pwd)/.gradle
  - chmod +x gradlew || true

build:
  stage: build
  script:
    - gradle assembleDebug --stacktrace
  artifacts:
    paths:
      - app/build/outputs/apk/debug/
    expire_in: 3 days

unit_tests:
  stage: test
  script:
    - gradle testDebugUnitTest --info
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    paths:
      - app/build/reports/tests/testDebugUnitTest/
    expire_in: 1 week

lint_check:
  stage: lint
  script:
    - gradle lintDebug || true
  artifacts:
    when: always
    paths:
      - app/build/reports/lint-results-debug.html
    expire_in: 1 week

ui_tests:
  stage: ui-test
  script:
    - echo "Executing Robolectric JVM-hosted UI tests..."
    - gradle testDebugUnitTest -Dtest.single=ExampleRobolectricTest
  artifacts:
    when: always
    paths:
      - app/build/reports/tests/
    expire_in: 1 week

package_apk:
  stage: package
  script:
    - gradle assembleRelease || gradle assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/
    expire_in: 30 days
  only:
    - main
    - tags
